# Every pull request runs the checks each change must pass, so a change's verification doesn't wait
# on a laptop shared with other agents' test runs, or die when that laptop sleeps (#48).
#
# Three jobs run in parallel, on GitHub's own runners, which are free for a public repo and start
# fresh for every job. Until 2026-11-01 `test-linux` ran on a self-hosted VM; docs/testing.md says
# why it went.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -race -count=1 -timeout 50m ./...

  # gofmt runs on the other two: a Windows checkout turns line endings into CRLF, which gofmt reports.
  # `internal/daemon` alone ran past the 50-minute limit on 2026-11-12 (#496) while the other
  # packages together took about 8 minutes, so it has its own jobs below.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go list ./... | grep -v '/internal/daemon$' | xargs go test -race -count=1 -timeout 50m

  # The daemon package's tests, dealt out by position in their sorted list to one runner each. A test
  # added later lands in some shard on its own, so none goes unrun.
  test-windows-daemon:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: go test -race (shard ${{ matrix.shard }} of 4)
        run: |
          names=$(go test -list '^Test' ./internal/daemon | grep '^Test' | sort | awk -v k=${{ matrix.shard }} 'NR % 4 == k')
          test -n "$names"
          echo "$names" | wc -l
          go test -race -count=1 -timeout 50m -run "^($(echo "$names" | paste -sd'|' -))\$" ./internal/daemon

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - run: go vet ./...
      # The site's Worker and the files machines read on it (site/test), with the runner's own node,
      # before the Go tests, which take most of the job.
      - run: node --test --import ./site/test/register.mjs site/test/*.test.mjs
      - run: go test -race -count=1 -timeout 50m ./...
