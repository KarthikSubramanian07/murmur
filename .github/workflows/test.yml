# Every pull request runs the checks each change must pass, so a change's verification doesn't wait
# on a laptop shared with other agents' test runs, or die when that laptop sleeps (#48).
#
# It runs on a self-hosted runner on Tyler's home server (macOS, 2 cores), as GitHub's own runners
# wouldn't start on this account (2026-10-29). That machine also serves Tyler's production work, so
# the runner service and every step run at background priority, one package at a time, and the job
# doesn't start while the machine is short of memory. docs/testing.md has the rest.
name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, homeserver]
    timeout-minutes: 60
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v5
      - name: Check the home server has room
        run: |
          swap=$(sysctl -n vm.swapusage | sed -E 's/.*used = ([0-9]+).*/\1/')
          if [ "$swap" -gt 1700 ]; then
            echo "::error::The home server is short of memory (${swap} MB of swap used), so the tests didn't run. Re-run the job later."
            exit 1
          fi
          go version
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - run: taskpolicy -b nice -n 20 go vet ./...
      - run: taskpolicy -b nice -n 20 go test -race -count=1 -timeout 50m ./...
