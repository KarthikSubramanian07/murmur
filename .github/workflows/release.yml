# Pushing a tag like v0.1.0 publishes a release: t4 built for macOS, Linux and Windows (amd64 and
# arm64), with a SHA256SUMS file that install.sh and install.ps1 check their download against (#58).
#
# It runs on the same self-hosted runner as test.yml, at the same background priority and with the
# same memory check, for the reasons in docs/testing.md. Unlike test.yml it needs no `if` to keep
# other people's code off that runner: only a tag push starts it, only people with write access
# can push a tag here, and a tag pushed to a fork runs in the fork. docs/releasing.md says how to
# cut a release.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, t4-ci]
    timeout-minutes: 30
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check the tag and that the runner's machine has room
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::The tag $GITHUB_REF_NAME is not a version like v1.2.3 or v1.2.3-pre.1, so nothing was released."
            exit 1
          fi
          swap=$(sysctl -n vm.swapusage | sed -E 's/.*used = ([0-9]+).*/\1/')
          if [ "$swap" -gt 1700 ]; then
            echo "::error::The runner's machine is short of memory (${swap} MB of swap used), so nothing was released. Re-run the job later."
            exit 1
          fi
          go version
      - name: Build every platform
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            ext=''
            if [ "$os" = windows ]; then ext=.exe; fi
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch taskpolicy -b nice -n 20 \
              go build -trimpath -ldflags "-X main.version=$version" -o "dist/t4-$os-$arch$ext" ./cmd/t4
          done
          # The runner's own binary must report the tag's version, or `-X` missed its variable.
          out=$(dist/t4-$(go env GOHOSTOS)-$(go env GOHOSTARCH) version)
          case "$out" in
            *" $version") ;;
            *) echo "::error::The built binary says \"$out\", not the version $version."; exit 1 ;;
          esac
          (cd dist && shasum -a 256 t4-* > SHA256SUMS && cat SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=''
          case "$GITHUB_REF_NAME" in *-*) flags=--prerelease ;; esac
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes $flags
