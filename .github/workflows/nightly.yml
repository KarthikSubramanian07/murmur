# Each night, the newest commit on main whose tests passed becomes a prerelease,
# vX.Y.Z-nightly.YYYYMMDD, for daemons on the prerelease channel (#244). X.Y.Z is the latest stable
# release with its patch raised by one, so a nightly sorts above the stable release it follows and
# below the next one. Nothing is tagged when main has nothing new since the last nightly or the
# latest stable release.
#
# A tag created with GITHUB_TOKEN starts no workflow, so release.yml's tag trigger never sees these;
# this workflow calls release.yml itself. Only the newest seven nightlies are kept.
# docs/releasing.md has the rest.
name: nightly

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Say what would be tagged and pruned, and change nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  tag:
    if: github.repository == 'a-Fig/murmur'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag
      actions: read # read test.yml's runs
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          # status BASE HEAD: ahead, behind, identical or diverged, from HEAD's side.
          status() { gh api "repos/$GH_REPO/compare/$1...$2" --jq .status; }

          # The newest commit on main whose test run passed. A run still going on main's head
          # leaves an older green commit, rather than no nightly.
          sha=$(gh api "repos/$GH_REPO/actions/workflows/test.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          if [ -z "$sha" ]; then echo "::notice::No passing test run on main; nothing tagged."; exit 0; fi
          main=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$sha" != "$main" ] && [ "$(status "$sha" "$main")" != ahead ]; then
            echo "::notice::$sha, the newest green commit, is no longer on main; nothing tagged."; exit 0
          fi

          stable=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          if ! printf '%s' "$stable" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The latest stable release is \"$stable\", not a version like v1.2.3."; exit 1
          fi
          # Newest last; a nightly's date orders it.
          nightlies=$(gh api "repos/$GH_REPO/git/matching-refs/tags/v" --paginate \
            --jq '.[] | select(.ref | test("^refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.[0-9]{8}$")) | "\(.ref | ltrimstr("refs/tags/")) \(.object.sha)"' \
            | awk '{ split($1, a, "nightly."); print a[2], $0 }' | sort -k1,1n -k2,2V | cut -d' ' -f2-)
          # A stable tag cut off main (a hotfix) leaves main diverged from it, which still counts as new.
          for base in "$stable" $(printf '%s\n' "$nightlies" | tail -n 1 | cut -d' ' -f2); do
            s=$(status "$base" "$sha")
            if [ "$s" = identical ] || [ "$s" = behind ]; then
              echo "::notice::$sha has nothing new since $base; nothing tagged."; exit 0
            fi
          done

          IFS=. read -r major minor patch <<< "${stable#v}"
          tag="v$major.$minor.$((patch + 1))-nightly.$(date -u +%Y%m%d)"
          if printf '%s\n' "$nightlies" | awk -v t="$tag" '$1 == t { found = 1 } END { exit !found }'; then
            echo "::notice::$tag already exists; nothing tagged."; exit 0
          fi
          echo "Tagging $sha as $tag."
          if [ "$DRY_RUN" = true ]; then echo "::notice::Dry run: $tag would point at $sha."; exit 0; fi
          gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" --silent
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}

  # Runs on nights that tagged nothing too, so a failed prune is retried.
  prune:
    needs: [tag, release]
    if: ${{ !cancelled() && needs.tag.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          keep=7
          old=$(gh api "repos/$GH_REPO/git/matching-refs/tags/v" --paginate \
            --jq '.[].ref | ltrimstr("refs/tags/") | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+-nightly\\.[0-9]{8}$"))' \
            | awk '{ split($1, a, "nightly."); print a[2], $1 }' | sort -k1,1n -k2,2V | cut -d' ' -f2 | head -n -"$keep")
          for t in $old; do
            echo "Deleting $t."
            if [ "$DRY_RUN" = true ]; then continue; fi
            # A tag whose build failed has no release.
            if gh release view "$t" > /dev/null 2>&1; then
              gh release delete "$t" --cleanup-tag --yes
            else
              gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$t" --silent
            fi
          done
