<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Murmur drafts</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f10;
    --surface: #1d1d20;
    --surface-hi: #2a2a2e;
    --text: #f1f1f1;
    --muted: #a3a3a8;
    --line: #2e2e33;
    --mono: ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    position: sticky; top: 0; z-index: 5;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px);
    padding: 14px 24px 12px;
  }
  .top { display: flex; align-items: center; gap: 12px; }
  .top img { width: 26px; height: 26px; }
  .top h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
  .top .count { color: var(--muted); font-size: 13px; margin-left: 4px; }
  .chips { display: flex; gap: 10px; margin-top: 14px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 0; cursor: pointer;
    font: 500 14px Inter, system-ui, sans-serif;
    padding: 7px 13px; border-radius: 8px;
    background: var(--surface-hi); color: var(--text);
    display: inline-flex; align-items: center; gap: 7px;
  }
  .chip:hover { background: #38383d; }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }

  main { padding: 12px 24px 64px; }
  .grid {
    display: grid; gap: 40px 16px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  }
  .card { cursor: pointer; border: 0; padding: 0; background: none; color: inherit; text-align: left; font: inherit; }
  .card[hidden] { display: none; }
  .thumb {
    position: relative; aspect-ratio: 16 / 10; border-radius: 12px; overflow: hidden;
    background: var(--surface);
  }
  .thumb img {
    width: 100%; height: 100%; object-fit: cover; object-position: top; display: block;
    transition: transform .35s ease;
  }
  .card:hover .thumb img, .card:focus-visible .thumb img { transform: scale(1.035); }
  .card:focus-visible { outline: none; }
  .card:focus-visible .thumb { outline: 2px solid var(--text); outline-offset: 3px; }
  .badge {
    position: absolute; right: 8px; bottom: 8px;
    background: rgba(0,0,0,.78); color: #fff;
    font: 600 12px Inter, system-ui, sans-serif; padding: 3px 6px; border-radius: 5px;
  }
  .play {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(0,0,0,.28); opacity: 0; transition: opacity .2s;
  }
  .play span {
    background: rgba(0,0,0,.72); color: #fff; font-weight: 600; font-size: 13px;
    padding: 8px 14px; border-radius: 999px;
  }
  .card:hover .play { opacity: 1; }
  .meta { display: flex; gap: 12px; margin-top: 12px; }
  .avatar {
    flex: none; width: 36px; height: 36px; border-radius: 50%; overflow: hidden;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .avatar i:first-child { grid-column: 1 / -1; }
  .meta h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; line-height: 1.3; }
  .meta p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .meta .hex { font-family: var(--mono); font-size: 12px; }
  .empty { color: var(--muted); padding: 40px 0; }

  /* Viewer */
  .viewer {
    position: fixed; inset: 0; z-index: 50; background: #000;
    display: none;
  }
  .viewer.open { display: block; }
  .viewer iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  .bar {
    position: absolute; top: 12px; left: 50%; transform: translate(-50%, 0);
    display: flex; align-items: center; gap: 4px;
    background: rgba(18,18,20,.86); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px; padding: 5px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    transition: opacity .25s, transform .25s;
  }
  .viewer.idle .bar { opacity: 0; transform: translate(-50%, -8px); pointer-events: none; }
  .bar .title { padding: 0 10px; font-weight: 600; white-space: nowrap; }
  .bar .pos { color: var(--muted); font-weight: 500; margin-left: 6px; }
  .bar button, .bar a {
    border: 0; background: none; color: var(--text); cursor: pointer;
    width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center;
    text-decoration: none;
  }
  .bar button:hover, .bar a:hover { background: rgba(255,255,255,.12); }
  .bar svg { width: 18px; height: 18px; }

  @media (max-width: 600px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    .grid { grid-template-columns: 1fr; }
    .bar .title { max-width: 40vw; overflow: hidden; text-overflow: ellipsis; }
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <img src="../favicon.svg" alt="">
    <h1>Murmur drafts</h1>
    <span class="count" id="count"></span>
  </div>
  <nav class="chips" id="chips" aria-label="Filter"></nav>
</header>

<main>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>Nothing matches.</p>
</main>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Draft viewer">
  <iframe id="frame" title="Draft"></iframe>
  <div class="bar">
    <button id="prev" title="Previous (←)" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span class="title"><span id="vtitle"></span><span class="pos" id="vpos"></span></span>
    <button id="next" title="Next (→)" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    <a id="newtab" target="_blank" rel="noopener" title="Open in new tab" aria-label="Open in new tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
    <button id="close" title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
</div>

<script>
const PALETTES = {
  live:    { name: 'Live',    colors: ['#225BFF', '#FFFBEA', '#FDEE8C'] },
  lagoon:  { name: 'Lagoon',  colors: ['#7BDFF2', '#FCFFFF', '#F2B5D4'] },
  signal:  { name: 'Signal',  colors: ['#015A85', '#4DCADF', '#FF4400'] },
  classic: { name: 'Classic', colors: ['#225BFF', '#FFFBEA', '#FDEE8C'] },
  royal:   { name: 'Royal',   colors: ['#723CD6', '#FCFFFF', '#EDB158'] },
};
const KINDS = { live: 'Live site', plain: 'Plain', tex: 'Textured', name: 'Textured + name', hero: 'Wordmark hero' };

const SITES = [
  { id: 'live',         palette: 'live',    kind: 'live',  url: '../' },
  { id: 'lagoon',       palette: 'lagoon',  kind: 'plain', url: 'lagoon/' },
  { id: 'lagoon-tex',   palette: 'lagoon',  kind: 'tex',   url: 'lagoon-tex/' },
  { id: 'hero-lagoon',  palette: 'lagoon',  kind: 'hero',  url: 'hero/lagoon.html', note: 'Waterline' },
  { id: 'signal',       palette: 'signal',  kind: 'plain', url: 'signal/' },
  { id: 'signal-tex',   palette: 'signal',  kind: 'tex',   url: 'signal-tex/' },
  { id: 'signal-tex-refract', palette: 'signal', kind: 'name', url: 'signal-tex-refract/', note: 'Refracted' },
  { id: 'signal-tex-cut',     palette: 'signal', kind: 'name', url: 'signal-tex-cut/',     note: 'Cut glass' },
  { id: 'signal-tex-surface', palette: 'signal', kind: 'name', url: 'signal-tex-surface/', note: 'Surface' },
  { id: 'hero-signal',  palette: 'signal',  kind: 'hero',  url: 'hero/signal.html' },
  { id: 'classic',      palette: 'classic', kind: 'plain', url: 'classic/' },
  { id: 'classic-tex',  palette: 'classic', kind: 'tex',   url: 'classic-tex/' },
  { id: 'classic-tex-refract', palette: 'classic', kind: 'name', url: 'classic-tex-refract/', note: 'Refracted' },
  { id: 'classic-tex-cut',     palette: 'classic', kind: 'name', url: 'classic-tex-cut/',     note: 'Cut glass' },
  { id: 'classic-tex-surface', palette: 'classic', kind: 'name', url: 'classic-tex-surface/', note: 'Surface' },
  { id: 'hero-classic', palette: 'classic', kind: 'hero',  url: 'hero/classic.html', note: 'Echo' },
  { id: 'royal',        palette: 'royal',   kind: 'tex',   url: 'royal/' },
  { id: 'hero-royal',   palette: 'royal',   kind: 'hero',  url: 'hero/royal.html' },
];
const titleOf = s => s.kind === 'live' ? 'Live site' : `${PALETTES[s.palette].name} · ${KINDS[s.kind]}`;

const FILTERS = [
  { key: 'all', label: 'All', test: () => true },
  { key: 'plain', label: 'Plain', test: s => s.kind === 'plain' },
  { key: 'tex', label: 'Textured', test: s => s.kind === 'tex' },
  { key: 'name', label: 'Textured + name', test: s => s.kind === 'name' },
  { key: 'hero', label: 'Wordmark hero', test: s => s.kind === 'hero' },
  ...['lagoon', 'signal', 'classic', 'royal'].map(p => ({
    key: p, label: PALETTES[p].name, dot: PALETTES[p].colors[2], test: s => s.palette === p,
  })),
];

const $ = id => document.getElementById(id);
const grid = $('grid'), chips = $('chips');

for (const s of SITES) {
  const p = PALETTES[s.palette];
  const b = document.createElement('button');
  b.className = 'card';
  b.dataset.id = s.id;
  b.innerHTML = `
    <div class="thumb">
      <img src="thumbs/${s.id}.webp" alt="" loading="lazy">
      <div class="play"><span>View full screen</span></div>
      <span class="badge">${KINDS[s.kind]}</span>
    </div>
    <div class="meta">
      <div class="avatar">${p.colors.map(c => `<i style="background:${c}"></i>`).join('')}</div>
      <div>
        <h2>${titleOf(s)}${s.note ? ` <span style="color:var(--muted);font-weight:500">“${s.note}”</span>` : ''}</h2>
        <p class="hex">${p.colors.join('  ')}</p>
        <p>${s.url.replace(/^\.\.\/$/, 'site/index.html')}</p>
      </div>
    </div>`;
  b.addEventListener('click', () => open(s.id));
  grid.appendChild(b);
}

let filter = 'all';
function renderChips() {
  chips.innerHTML = '';
  for (const f of FILTERS) {
    const c = document.createElement('button');
    c.className = 'chip';
    c.setAttribute('aria-pressed', f.key === filter);
    c.innerHTML = (f.dot ? `<span class="dot" style="background:${f.dot}"></span>` : '') + f.label;
    c.onclick = () => { filter = f.key; applyFilter(); };
    chips.appendChild(c);
  }
}
function visible() {
  const f = FILTERS.find(f => f.key === filter);
  return SITES.filter(s => s.kind === 'live' ? filter === 'all' : f.test(s));
}
function applyFilter() {
  const ids = new Set(visible().map(s => s.id));
  for (const el of grid.children) el.hidden = !ids.has(el.dataset.id);
  $('count').textContent = `${ids.size} pages`;
  $('empty').hidden = ids.size > 0;
  renderChips();
}
applyFilter();

// Viewer
const viewer = $('viewer'), frame = $('frame');
let current = null, idleTimer;

function show(id) {
  const list = visible();
  const s = SITES.find(x => x.id === id);
  current = id;
  if (frame.dataset.src !== s.url) { frame.src = s.url; frame.dataset.src = s.url; }
  $('vtitle').textContent = titleOf(s);
  const i = list.findIndex(x => x.id === id);
  $('vpos').textContent = i >= 0 ? `${i + 1} / ${list.length}` : '';
  $('newtab').href = s.url;
  history.replaceState(null, '', '#' + id);
  wake();
}
function open(id) {
  show(id);
  viewer.classList.add('open');
  document.body.style.overflow = 'hidden';
  if (viewer.requestFullscreen && !document.fullscreenElement) viewer.requestFullscreen().catch(() => {});
}
function close() {
  viewer.classList.remove('open');
  document.body.style.overflow = '';
  frame.src = 'about:blank'; frame.dataset.src = '';
  history.replaceState(null, '', location.pathname);
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  const card = grid.querySelector(`[data-id="${current}"]`);
  current = null;
  card && card.focus();
}
function step(d) {
  const list = visible();
  let i = list.findIndex(x => x.id === current);
  if (i < 0) i = 0;
  show(list[(i + d + list.length) % list.length].id);
}
function wake() {
  viewer.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => viewer.classList.add('idle'), 2200);
}

$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
$('close').onclick = close;
viewer.addEventListener('mousemove', wake);
// The iframe swallows mouse events; reveal the bar when the pointer nears the top edge.
frame.addEventListener('load', () => {
  try {
    const w = frame.contentWindow;
    w.addEventListener('mousemove', e => { if (e.clientY < 90) wake(); });
    w.addEventListener('keydown', onKey);
  } catch (_) {}
});
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && viewer.classList.contains('open')) close();
});
function onKey(e) {
  if (!viewer.classList.contains('open')) return;
  if (e.key === 'Escape') close();
  else if (e.key === 'ArrowRight') step(1);
  else if (e.key === 'ArrowLeft') step(-1);
}
document.addEventListener('keydown', onKey);

const start = location.hash.slice(1);
if (SITES.some(s => s.id === start)) { show(start); viewer.classList.add('open'); document.body.style.overflow = 'hidden'; }
</script>
</body>
</html>
